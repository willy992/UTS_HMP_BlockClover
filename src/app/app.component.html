<ion-app>
  <ion-menu menuId="main-menu" contentId="main-content" type="overlay">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>SIMOBILE</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list>
        <ion-list-header>
          <ion-label>Navigasi</ion-label>
        </ion-list-header>

        <ion-menu-toggle autoHide="false">
          <ion-item
            routerLink="/tabs/dashboard"
            routerDirection="root"
            routerLinkActive="selected"
            lines="none"
            detail="false"
          >
            <ion-icon
              name="home-outline"
              slot="start"
              aria-hidden="true"
            ></ion-icon>
            <ion-label>Dashboard</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item
            routerLink="/tabs/products"
            routerDirection="root"
            routerLinkActive="selected"
            lines="none"
            detail="false"
          >
            <ion-icon name="cube-outline" slot="start" aria-hidden="true">
            </ion-icon>
            <ion-label>Produk</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item
            routerLink="/tabs/transactions"
            routerDirection="root"
            routerLinkActive="selected"
            lines="none"
            detail="false"
          >
            <ion-icon name="receipt-outline" slot="start" aria-hidden="true">
            </ion-icon>
            <ion-label>Transaksi</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item
            routerLink="/tabs/profile"
            routerDirection="root"
            routerLinkActive="selected"
            lines="none"
            detail="false"
          >
            <ion-icon
              name="person-circle-outline"
              slot="start"
              aria-hidden="true"
            >
            </ion-icon>
            <ion-label>Profil</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>

      <ion-list>
        <ion-list-header>
          <ion-label>Aplikasi</ion-label>
        </ion-list-header>

        <ion-menu-toggle autoHide="false">
          <ion-item
            routerLink="/settings"
            routerDirection="forward"
            routerLinkActive="selected"
            lines="none"
            detail="false"
          >
            <ion-icon name="settings-outline" slot="start" aria-hidden="true">
            </ion-icon>
            <ion-label>Pengaturan</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item
            routerLink="/about"
            routerDirection="forward"
            routerLinkActive="selected"
            lines="none"
            detail="false"
          >
            <ion-icon
              name="information-circle-outline"
              slot="start"
              aria-hidden="true"
            >
            </ion-icon>
            <ion-label>Tentang Aplikasi</ion-label>
          </ion-item>
        </ion-menu-toggle>

        <ion-menu-toggle autoHide="false">
          <ion-item
            button="true"
            lines="none"
            detail="false"
            (click)="simulateLogout()"
          >
            <ion-icon name="log-out-outline" slot="start" aria-hidden="true">
            </ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-menu-button
    class="global-menu-button"
    menu="main-menu"
    aria-label="Buka menu utama"
  >
  </ion-menu-button>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
