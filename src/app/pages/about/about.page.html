<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>about</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">about</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>SIMOBILE</ion-card-title>
      <ion-card-subtitle>Aplikasi E-commerce SIMOBILE</ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      SIMOBILE merupakan aplikasi E-commerce yang dibuat oleh kelompok blablabla
      piro yo, mbo lali.
    </ion-card-content>
  </ion-card>

  <ion-list inset="true">
    <ion-item>
      <ion-icon
        name="layers-outline"
        slot="start"
        aria-hidden="true"
      ></ion-icon>
      <ion-label>
        <h2>Framework</h2>
        <p>Ionic Angular</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-icon
        slot="start"
        name="code-slash-outline"
        aria-hidden="true"
      ></ion-icon>
      <ion-label>
        <h2>Arsitektur</h2>
        <p>Angular Ngmodule</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-icon slot="start" name="people" aria-hidden="true"></ion-icon>
      <ion-label>
        <h2>Developer</h2>
        <p>Willy Suryawan</p>
        <p>Felix Christian</p>
        <p>Dariel Jo Setiawan</p>
        <p>Jason Terry Adinata</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
