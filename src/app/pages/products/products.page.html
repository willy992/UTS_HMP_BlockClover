<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Produk</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-searchbar
  [(ngModel)]="searchQuery"
  placeholder="Cari nama atau kategori produk"
  aria-label="Cari produk"
></ion-searchbar>
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Produk</ion-title>
    </ion-toolbar>
  </ion-header>

  <ng-container *ngIf="filteredProducts.length > 0; else emptyState">
    <ion-grid>
      <ion-row>
        <ion-col
         *ngFor="let product of filteredProducts"
         size="12"
         size-md="6"
         size-lg="4"
        >
          <ion-card
            button="true"
            [routerLink]="['/product', product.id]"
            class="product-card"
          >
            <ion-card-header>
              <ion-card-subtitle>{{ product.category }}</ion-card-subtitle>
              <ion-card-title>{{ product.name }}</ion-card-title>
            </ion-card-header>

            <ion-card-content>
              <p class="product-price">
                {{ formatRupiah(product.sellingPrice) }}
              </p>
              <p>Stok: {{ product.stock }}</p>
              <p>Terjual: {{ product.sold }}</p>
            </ion-card-content>
          </ion-card>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ng-container>

  <ng-template #emptyState>
  <div class="empty-state">
    <ion-icon name="cube-outline" aria-hidden="true"></ion-icon>

    <ng-container *ngIf="searchQuery.trim(); else noProducts">
      <h2>Produk tidak ditemukan</h2>
      <p>Coba kata kunci lain.</p>
    </ng-container>

    <ng-template #noProducts>
      <h2>Belum ada produk</h2>
      <p>Produk yang tersedia akan muncul di sini.</p>
    </ng-template>
  </div>
</ng-template>
</ion-content>
