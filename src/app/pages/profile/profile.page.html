<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Profil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Profil</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>SIMOBILE</ion-card-title>
      <ion-card-subtitle> Sistem Informasi Penjualan Mobile </ion-card-subtitle>
    </ion-card-header>

    <ion-card-content>
      Aplikasi penjualan sederhana yang dibuat menggunakan Ionic Angular dengan
      arsitektur NgModule.
    </ion-card-content>
  </ion-card>

  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Developer</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-label>Willy</ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-label>Dariel</ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-label>Felix</ion-label>
    </ion-item>

    <ion-item>
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-label>Jason</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
