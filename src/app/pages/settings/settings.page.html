<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Preferensi aplikasi</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-icon name="moon-outline" slot="start" aria-hidden="true"></ion-icon>
      <ion-label>
        <h2>Tampilan aplikasi</h2>
        <p>Atur tema dan preferensi tampilan SIMOBILE.</p>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
