<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Settings</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Settings</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-list inset="true">
    <ion-list-header>
      <ion-label>Preferensi aplikasi</ion-label>
    </ion-list-header>

    <ion-item>
      <ion-icon name="moon-outline" slot="start" aria-hidden="true"></ion-icon>

      <ion-label>
        <h2>Dark mode</h2>
        <p>Gunakan tampilan gelap pada SIMOBILE.</p>
      </ion-label>

      <ion-toggle
        slot="end"
        aria-label="Aktifkan dark mode"
        [(ngModel)]="isDarkMode"
        (ngModelChange)="setDarkMode($event)"
      ></ion-toggle>
    </ion-item>
  </ion-list>

  <ion-note color="medium" class="ion-padding-horizontal">
    Pilihan tema disimpan pada perangkat ini.
  </ion-note>
</ion-content>
